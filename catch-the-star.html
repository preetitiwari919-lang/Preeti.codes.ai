<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catch the Star</title><style>
body{font-family:Arial,sans-serif;background:#f5f7fc;color:#182238;margin:0;padding:24px}.wrap{max-width:680px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 8px 25px #17233a12}h1{margin-top:0}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}button{border:0;background:#5556cf;color:white;padding:10px 15px;border-radius:9px;font-weight:bold;cursor:pointer}#board{height:340px;position:relative;overflow:hidden;border-radius:14px;background:linear-gradient(#dff3ff,#f0f8ff);border:1px solid #cbd9e8;margin-top:16px}#star{position:absolute;font-size:36px;cursor:pointer;user-select:none;display:none}small{color:#61708a}</style></head><body><div class="wrap"><div class="bar"><div><h1>⭐ Catch the Star</h1><small>Click the star as many times as you can in 20 seconds.</small></div><div><strong>Score: <span id="score">0</span></strong> &nbsp; <strong>Time: <span id="time">20</span>s</strong></div></div><p><button id="start">Start game</button> <button id="reset">Reset</button></p><div id="board"><span id="star">⭐</span></div><p id="message" aria-live="polite">Press Start to play.</p><small>Concepts: variables (score/time), events (click), conditions (game over), and random positioning.</small></div>
<script>
const board=document.querySelector('#board'),star=document.querySelector('#star'),scoreText=document.querySelector('#score'),timeText=document.querySelector('#time'),message=document.querySelector('#message');
let score=0,time=20,timer=null,playing=false;
function moveStar(){const maxX=board.clientWidth-42,maxY=board.clientHeight-46;star.style.left=Math.floor(Math.random()*Math.max(1,maxX))+'px';star.style.top=Math.floor(Math.random()*Math.max(1,maxY))+'px';}
function finish(){playing=false;clearInterval(timer);star.style.display='none';message.textContent='Time is up! Your final score is '+score+'. Press Start to play again.';}
document.querySelector('#start').addEventListener('click',()=>{if(playing)return;score=0;time=20;playing=true;scoreText.textContent=score;timeText.textContent=time;message.textContent='Go! Catch the star.';star.style.display='block';moveStar();timer=setInterval(()=>{time--;timeText.textContent=time;if(time<=0)finish();},1000);});
star.addEventListener('click',()=>{if(!playing)return;score++;scoreText.textContent=score;moveStar();});
document.querySelector('#reset').addEventListener('click',()=>{clearInterval(timer);playing=false;score=0;time=20;scoreText.textContent=score;timeText.textContent=time;star.style.display='none';message.textContent='Press Start to play.';});
window.addEventListener('resize',()=>{if(playing)moveStar();});
</script></body></html>
