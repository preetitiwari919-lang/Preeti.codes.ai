<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coding Concepts Quiz</title><style>
body{font-family:Arial,sans-serif;background:#f5f7fc;color:#182238;padding:24px;margin:0}.panel{max-width:700px;margin:auto;background:white;border-radius:18px;padding:25px;box-shadow:0 8px 25px #17233a12}h1{margin-top:0}.muted{color:#61708a}.option{display:block;width:100%;text-align:left;padding:13px;margin:9px 0;border:1px solid #dbe2ee;border-radius:10px;background:#fff;color:#182238;cursor:pointer}.option:hover{border-color:#5b5bd6}.option:disabled{cursor:default}.correct{background:#e8f7ed;border-color:#58a875}.wrong{background:#fff0ef;border-color:#d77}.primary{background:#5556cf;color:white;border:0;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:bold}#feedback{min-height:28px;font-weight:bold}</style></head><body><main class="panel"><h1>💡 Coding Concepts Quiz</h1><p class="muted">Try these beginner questions. Choose one answer to receive feedback.</p><p><strong>Question <span id="number">1</span> of 5</strong> · Score: <span id="score">0</span></p><h2 id="question"></h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button class="primary" id="next" disabled>Next question</button></main>
<script>
const qs=[
{q:'What does a variable do in a program?',a:['Stores information','Plays music only','Turns off the computer'],c:0,e:'A variable stores a value, such as a score or a name.'},
{q:'Which Scratch category contains the green-flag event?',a:['Motion','Events','Looks'],c:1,e:'Events blocks start scripts when something happens, such as clicking the green flag.'},
{q:'What is a loop used for?',a:['Repeating instructions','Changing the screen colour only','Deleting a project'],c:0,e:'A loop repeats a set of instructions.'},
{q:'What does an if-condition help a program do?',a:['Make a decision','Print every page','Charge a battery'],c:0,e:'An if-condition runs instructions when a condition is true.'},
{q:'What is debugging?',a:['Finding and fixing errors','Adding random pictures','Renaming a computer'],c:0,e:'Debugging means finding and correcting problems in a program.'}
];let i=0,score=0,answered=false;
const $=s=>document.querySelector(s);
function render(){$('#number').textContent=i+1;$('#score').textContent=score;$('#question').textContent=qs[i].q;$('#feedback').textContent='';$('#next').disabled=true;answered=false;$('#options').innerHTML='';qs[i].a.forEach((v,n)=>{const b=document.createElement('button');b.className='option';b.textContent=v;b.onclick=()=>choose(n,b);$('#options').appendChild(b);});$('#next').textContent=i===qs.length-1?'See result':'Next question';}
function choose(n,btn){if(answered)return;answered=true;const q=qs[i];[...$('#options').children].forEach((b,k)=>{b.disabled=true;if(k===q.c)b.classList.add('correct');});if(n===q.c){score++;$('#feedback').textContent='Correct! '+q.e;}else{$('#feedback').textContent='Not quite. '+q.e;btn.classList.add('wrong');}$('#score').textContent=score;$('#next').disabled=false;}
$('#next').onclick=()=>{if(i<qs.length-1){i++;render();}else{$('.panel').innerHTML='<h1>Quiz complete! 🎉</h1><h2>Your score: '+score+' / '+qs.length+'</h2><p class="muted">Review any missed concepts and try again.</p><button class="primary" onclick="location.reload()">Try again</button>';}};render();
</script></body></html>
