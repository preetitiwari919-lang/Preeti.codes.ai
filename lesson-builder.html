<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson Activity Builder</title><style>
body{font-family:Arial,sans-serif;background:#f5f7fc;color:#182238;padding:24px;margin:0}.panel{max-width:720px;margin:auto;background:white;padding:25px;border-radius:18px;box-shadow:0 8px 25px #17233a12}label{display:block;margin:15px 0 6px;font-weight:bold}select,button{padding:11px;border-radius:9px;border:1px solid #ccd5e3;font:inherit}select{width:100%;background:white}button{background:#5556cf;color:white;border:0;font-weight:bold;cursor:pointer;margin-top:16px}.result{background:#f0f1ff;border-radius:12px;padding:18px;margin-top:20px;white-space:pre-wrap;line-height:1.7}.note{color:#61708a;font-size:.9rem}</style></head><body><main class="panel"><h1>🧩 Lesson Activity Builder</h1><p class="note">A small rule-based teaching aid for planning a beginner coding activity. It does not use an AI model.</p><label for="age">Learner age group</label><select id="age"><option value="6–8">6–8 years</option><option value="9–11">9–11 years</option><option value="12–14">12–14 years</option></select><label for="topic">Lesson topic</label><select id="topic"><option value="Sequences">Sequences</option><option value="Events">Events</option><option value="Loops">Loops</option><option value="Variables">Variables</option><option value="Conditions">Conditions</option></select><button id="make">Create lesson outline</button><div id="result" class="result" hidden aria-live="polite"></div></main>
<script>
const descriptions={Sequences:'Put instructions in the correct order to make a character reach a goal.',Events:'Make a character respond when the green flag or a key is pressed.',Loops:'Repeat a movement or action several times instead of writing it repeatedly.',Variables:'Create a score variable and change its value when the player earns points.',Conditions:'Use an if/then rule to make the program respond to a situation.'};
document.querySelector('#make').onclick=()=>{const age=document.querySelector('#age').value,topic=document.querySelector('#topic').value;const level=age==='6–8'?'Use picture cards and a short teacher demonstration.':age==='9–11'?'Demonstrate a small Scratch example, then let learners modify it.':'Ask learners to plan, build, test and explain their own solution.';const text='LESSON OUTLINE\\nAge group: '+age+' years\\nTopic: '+topic+'\\n\\nLearning goal\\nLearners will understand '+topic.toLowerCase()+' in a simple program.\\n\\nExplain\\n'+descriptions[topic]+'\\n\\nActivity\\n'+level+'\\n\\nCheck understanding\\nAsk learners to explain what their code does and predict what will happen if they change one instruction.\\n\\nExtension\\nInvite learners to add one new feature or solve a small challenge.';const box=document.querySelector('#result');box.textContent=text;box.hidden=false;};
</script></body></html>
